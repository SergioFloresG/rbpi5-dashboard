<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="pantalla">
  <section class="panel izq">
    <div id="mapa" class="mapa"></div>

    <header class="cabecera">
      <div class="reloj">
        <div id="hora" class="hora">--:--</div>
        <div id="fecha" class="fecha"></div>
      </div>
      <div class="clima">
        <div id="icono" class="icono"></div>
        <div>
          <div id="temp" class="temp">--°</div>
          <div id="desc" class="desc"></div>
          <div id="maxmin" class="maxmin"></div>
        </div>
      </div>
    </header>

    <div class="pron" id="pron" hidden></div>
    <div class="pron" id="dias" hidden></div>

    <div class="tarjetas">
      <article class="tarjeta">
        <h3>Sensación</h3>
        <div class="valor" id="sensacion">--</div>
      </article>
      <article class="tarjeta">
        <h3>Humedad</h3>
        <div class="valor" id="humedad">--</div>
        <div class="barra"><span id="humedad-barra"></span></div>
      </article>
      <article class="tarjeta">
        <h3>Viento</h3>
        <div class="fila">
          <svg id="brujula" class="brujula" viewBox="-50 -50 100 100">
            <circle r="46" class="aro"/>
            <text y="-30" class="pc">N</text>
            <g id="flecha"><path d="M0,-28 L9,10 L0,4 L-9,10 Z" class="flecha"/></g>
          </svg>
          <div>
            <div class="valor" id="viento">--</div>
            <div class="sub" id="viento-sub"></div>
          </div>
        </div>
      </article>
      <article class="tarjeta">
        <h3>Índice UV</h3>
        <div class="valor" id="uv">--</div>
        <div class="sub" id="uv-sub"></div>
      </article>
      <article class="tarjeta">
        <h3>Calidad del aire</h3>
        <div class="valor" id="aqi">--</div>
        <div class="sub" id="aqi-sub"></div>
      </article>
      <article class="tarjeta">
        <h3>Visibilidad</h3>
        <div class="valor" id="visibilidad">--</div>
      </article>
      <article class="tarjeta">
        <h3>Presión</h3>
        <div class="valor" id="presion">--</div>
      </article>
      <article class="tarjeta">
        <h3>Sol</h3>
        <div class="par"><span>Amanecer</span><b id="amanecer">--</b></div>
        <div class="par"><span>Anochecer</span><b id="anochecer">--</b></div>
      </article>
      <article class="tarjeta">
        <h3>Luna</h3>
        <div class="fila">
          <svg id="luna" class="luna" viewBox="-50 -50 100 100"></svg>
          <div>
            <div class="sub fuerte" id="fase">--</div>
            <div class="par"><span>Sale</span><b id="luna-sale">--</b></div>
            <div class="par"><span>Pone</span><b id="luna-pone">--</b></div>
          </div>
        </div>
      </article>
      <article class="tarjeta">
        <h3>Radar</h3>
        <div class="valor chico" id="radar-hora">--</div>
        <div class="leyenda"><span>Ligera</span><i></i><span>Intensa</span></div>
      </article>
    </div>
    <footer class="pie" id="pie"></footer>
  </section>

  <section class="panel der">
    <article class="tarjeta bat" id="bat" hidden>
      <div class="bat-carga">
        <svg class="rueda" viewBox="0 0 120 120">
          <circle class="fondo" cx="60" cy="60" r="52"/>
          <circle class="nivel" id="bat-nivel" cx="60" cy="60" r="52"/>
          <line class="lim" id="bat-lim"/>
          <text x="60" y="64" class="pct" id="bat-pct">--</text>
          <text x="60" y="82" class="est" id="bat-est"></text>
        </svg>
        <div class="bat-info">
          <span class="t">Batería</span>
          <span class="v" id="bat-tiempo">--</span>
          <span class="s" id="bat-tiempo-sub"></span>
          <span class="s" id="bat-packs"></span>
          <span class="s" id="bat-wh"></span>
        </div>
      </div>
      <div class="bat-ent">
        <div class="cab"><h3>Entrada</h3><div class="valor" id="bat-entrada">--</div></div>
        <div class="lista" id="bat-entradas"></div>
      </div>
      <div class="bat-sal">
        <div class="cab"><h3>Salida</h3><div class="valor" id="bat-salida">--</div></div>
        <div class="lista" id="bat-salidas"></div>
      </div>
      <div class="bat-salud">
        <h3>Salud</h3>
        <div id="bat-salud"></div>
      </div>
    </article>
    <div class="bat-aviso" id="bat-aviso" hidden></div>
    <div class="ups-lista" id="ups"></div>
    <div class="bat-aviso" id="ups-aviso" hidden></div>
    <div class="aire-lista" id="dyson"></div>
    <div class="bat-aviso" id="dyson-aviso" hidden></div>
    <div class="vacio">Panel derecho<br><small>por definir</small></div>
  </section>
</main>
<script src="/static/vendor/leaflet.js"></script>
<script src="/static/app.js"></script>
<script src="/static/radar.js"></script>
<script src="/static/bateria.js"></script>
<script src="/static/ups.js"></script>
<script src="/static/dyson.js"></script>
</body>
</html>
